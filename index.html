/* ---------------------------------------------------------------------- */
/* API helper                                                              */
/* ---------------------------------------------------------------------- */
async function api(pathName, { method = "GET", body, isForm = false } = {}) {
  const headers = {};
  if (state.user) headers.Authorization = `Bearer ${await state.user.getIdToken()}`;
  if (!isForm && body !== undefined) headers["Content-Type"] = "application/json";
  const res = await fetch(`/api${pathName}`, {
    method,
    headers,
    body: body === undefined ? undefined : isForm ? body : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || "Something went wrong. Please try again.");
    err.code = data.code;
    throw err;
  }
  return data;
}

function formatBytes(bytes) {
  if (!Number.isFinite(bytes)) return "";
  if (bytes < 1024) return `${bytes} B`;
  const units = ["KB", "MB", "GB"];
  let value = bytes / 1024;
  let unitIndex = 0;
  while (value >= 1024 && unitIndex < units.length - 1) {
    value /= 1024;
    unitIndex += 1;
  }
  return `${value.toFixed(value < 10 ? 1 : 0)} ${units[unitIndex]}`;
}

const CANCELLED = Symbol("cancelled");
const activeUploads = new Map(); // batchId -> XMLHttpRequest, so the cancel button can abort it

// fetch() has no upload progress event (and no cancel-friendly API here) —
// XHR is the only way to report real bytes-sent progress and to let the
// user actually abort an upload in flight.
async function uploadWithProgress(pathName, formData, { onProgress, batchId } = {}) {
  const token = state.user ? await state.user.getIdToken() : null;
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", `/api${pathName}`);
    if (token) xhr.setRequestHeader("Authorization", `Bearer ${token}`);
    if (batchId) activeUploads.set(batchId, xhr);
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) onProgress(e.loaded, e.total);
    };
    xhr.onload = () => {
      let data = {};
      try { data = JSON.parse(xhr.responseText || "{}"); } catch {}
      if (xhr.status >= 200 && xhr.status < 300) resolve(data);
      else reject(new Error(data.error || "Upload failed. Please try again."));
    };
    xhr.onerror = () => reject(new Error("Upload failed. Please check your connection and try again."));
    xhr.onabort = () => reject(CANCELLED);
    xhr.send(formData);
  });
}

function updateUploadProgressUI(batchId, loaded, total) {
  const pct = total > 0 ? Math.min(100, Math.round((loaded / total) * 100)) : 0;
  const sizeText = `${formatBytes(loaded)} / ${formatBytes(total)}`;
  document.querySelectorAll(`[data-progress-bar="${batchId}"]`).forEach((el) => { el.style.width = `${pct}%`; });
  document.querySelectorAll(`[data-progress-text="${batchId}"]`).forEach((el) => { el.textContent = sizeText; });
}

async function handleFiles(fileList) {
  const files = Array.from(fileList || []);
  if (files.length === 0) return;

  if (!state.user) {
    state.assets.push(...files.map((f) => ({
      id: `local-${Math.random().toString(36).slice(2)}`, type: f.type.startsWith("image") ? "image" : "video",
      originalName: f.name, sizeBytes: f.size, _localOnly: true, previewUrl: URL.createObjectURL(f),
    })));
    renderMediaGrid();
    return;
  }

  // Show every selected file immediately — with a local preview, its size,
  // and a live progress bar — instead of leaving the UI blank while a slow
  // connection uploads in the background.
  const batchId = `batch-${Math.random().toString(36).slice(2)}`;
  const totalBytes = files.reduce((sum, f) => sum + f.size, 0);
  const placeholders = files.map((f) => ({
    id: `${batchId}-${Math.random().toString(36).slice(2)}`,
    type: f.type.startsWith("image") ? "image" : "video",
    originalName: f.name,
    sizeBytes: f.size,
    previewUrl: URL.createObjectURL(f),
    _uploading: true,
    _batchId: batchId,
  }));
  state.assets.push(...placeholders);
  renderMediaGrid();
  updateUploadProgressUI(batchId, 0, totalBytes);

  try {
    await ensureDraft();
    const form = new FormData();
    files.forEach((f) => form.append("media", f));
    const data = await uploadWithProgress(`/drafts/${state.draftId}/media`, form, {
      batchId,
      onProgress: (loaded, total) => updateUploadProgressUI(batchId, loaded, total),
    });
    activeUploads.delete(batchId);
    state.assets = data.assets;
    renderMediaGrid();
    refreshEstimate();
    if (data.skipped && data.skipped.length > 0) {
      showToastError(`Couldn't process: ${data.skipped.join(", ")}. The rest uploaded fine.`);
    }
  } catch (err) {
    activeUploads.delete(batchId);
    state.assets = state.assets.filter((a) => a._batchId !== batchId);
    renderMediaGrid();
    if (err === CANCELLED) return;
    showToastError(err.message);
  }
}

function renderMediaGrid() {
  const grid = document.getElementById("mediaGrid");
  if (!grid) return;
  if (state.assets.length === 0) {
    grid.innerHTML = "";
    return;
  }
  grid.innerHTML = state.assets
    .map((a, i) => {
      const preview = a.previewUrl
        ? a.type === "image"
          ? `<img class="thumb" src="${a.previewUrl}" alt="" />`
          : `<video class="thumb" src="${a.previewUrl}" muted preload="metadata"></video>`
        : `<div class="thumb" style="display:flex;align-items:center;justify-content:center;">${icon(a.type === "video" ? "video" : "image")}</div>`;
      const uploadingOverlay = a._uploading
        ? `<div class="upload-overlay">
             <div class="upload-progress-track"><div class="upload-progress-bar" data-progress-bar="${a._batchId}" style="width:0%"></div></div>
             <span class="upload-progress-text" data-progress-text="${a._batchId}">${formatBytes(a.sizeBytes)}</span>
           </div>`
        : "";
      return `
    <div class="media-card" draggable="${!a._uploading}" data-index="${i}">
      <div class="badge">${a.type}</div>
      ${
        a._uploading
          ? `<button class="remove" data-cancel-batch="${a._batchId}" aria-label="Cancel upload">${icon("close")}</button>`
          : `<button class="remove" data-remove="${a.id}" aria-label="Remove ${escapeHtml(a.originalName)}">${icon("close")}</button>`
      }
      ${preview}
      ${uploadingOverlay}
      <div class="meta">${escapeHtml(a.originalName)}${a.durationSeconds ? ` · ${Math.round(a.durationSeconds)}s` : a.sizeBytes ? ` · ${formatBytes(a.sizeBytes)}` : ""}</div>
    </div>`;
    })
    .join("");

  grid.querySelectorAll("[data-cancel-batch]").forEach((btn) =>
    btn.addEventListener("click", () => {
      const xhr = activeUploads.get(btn.dataset.cancelBatch);
      if (xhr) xhr.abort();
    })
  );

  grid.querySelectorAll("[data-remove]").forEach((btn) =>
    btn.addEventListener("click", async () => {
      const id = btn.dataset.remove;
      const asset = state.assets.find((a) => a.id === id);
      state.assets = state.assets.filter((a) => a.id !== id);
      renderMediaGrid();
      refreshEstimate();
      if (state.user && asset && !asset._localOnly) {
        await api(`/drafts/${state.draftId}/media/${id}`, { method: "DELETE" }).catch(() => {});
      }
    })
  );

  let dragSrc = null;
  grid.querySelectorAll(".media-card[draggable='true']").forEach((card) => {
    card.addEventListener("dragstart", () => { dragSrc = Number(card.dataset.index); card.classList.add("dragging"); });
    card.addEventListener("dragend", () => card.classList.remove("dragging"));
    card.addEventListener("dragover", (e) => e.preventDefault());
    card.addEventListener("drop", async (e) => {
      e.preventDefault();
      const dest = Number(card.dataset.index);
      if (dragSrc === null || dragSrc === dest) return;
      const [moved] = state.assets.splice(dragSrc, 1);
      state.assets.splice(dest, 0, moved);
      renderMediaGrid();
      if (state.user && state.draftId) {
        await api(`/drafts/${state.draftId}/reorder`, { method: "POST", body: { order: state.assets.map((a) => a.id) } }).catch(() => {});
      }
    });
  });
}

let estimateDebounce = null;
function refreshEstimate() {
  clearTimeout(estimateDebounce);
  estimateDebounce = setTimeout(async () => {
    const unitsEl = document.getElementById("estimateUnits");
    const remainingEl = document.getElementById("estimateRemaining");
    if (!unitsEl) return;
    if (!state.user || !state.draftId || state.assets.length === 0) {
      unitsEl.textContent = "—";
      remainingEl.textContent = state.usage ? state.usage.remainingUnits : "—";
      return;
    }
    try {
      const data = await api(`/drafts/${state.draftId}/estimate`, { method: "POST", body: { options: createOptions } });
      unitsEl.textContent = data.estimate.totalUnits;
      remainingEl.textContent = data.remainingUnits;
    } catch {
      unitsEl.textContent = "—";
    }
  }, 300);
}

async function handleCreateVideo() {
  if (!state.user) return openAuthModal("signup", "Create a free account to start editing.");
  if (state.assets.length === 0) return showToastError("Upload at least one video or photo first.");

  const statusEl = document.getElementById("jobStatus");
  try {
    await ensureDraft();
    const { jobId } = await api(`/drafts/${state.draftId}/render`, {
      method: "POST",
      body: { prompt: createPrompt, options: createOptions, targetAspectRatio: createOptions.aspectRatio },
    });
    activeJobId = jobId;
    pollJob(jobId);
  } catch (err) {
    statusEl.innerHTML = `<div class="auth-error">${escapeHtml(err.message)}</div>`;
  }
}

function pollJob(jobId) {
  clearInterval(state.jobPollHandle);
  const statusEl = document.getElementById("jobStatus");
  if (!statusEl) return;

  const tick = async () => {
    try {
      const job = await api(`/jobs/${jobId}`);
      if (!document.getElementById("jobStatus")) return;
      if (job.status === "failed") {
        clearInterval(state.jobPollHandle);
        statusEl.innerHTML = `<div class="auth-error">${escapeHtml(job.error)}</div>`;
        return;
      }
      if (job.status === "completed") {
        clearInterval(state.jobPollHandle);
        statusEl.innerHTML = `
          <div class="auth-note">Your video is ready.</div>
          <button class="btn btn-primary create-cta" id="downloadVideoBtn">Download video</button>`;
        document.getElementById("downloadVideoBtn").addEventListener("click", () => downloadJobVideo(jobId));
        refreshUsage();
        return;
      }
      statusEl.innerHTML = `
        <p style="font-size:13px;">${job.status === "queued" ? "Queued — waiting for a processing slot..." : "Gift Visuals is editing your video..."}</p>
        <div class="progress-bar"><div style="width:${job.progress}%"></div></div>`;
    } catch {
      clearInterval(state.jobPollHandle);
    }
  };
  tick();
  state.jobPollHandle = setInterval(tick, 2500);
}

function showToastError(msg) {
  const statusEl = document.getElementById("jobStatus");
  if (statusEl) statusEl.innerHTML = `<div class="auth-error">${escapeHtml(msg)}</div>`;
}

// A plain <a href> to an authenticated endpoint won't carry our Firebase
// bearer token — the browser navigates there with no auth header at all.
// Fetch it ourselves (with the token) and hand the browser the resulting
// blob instead.
async function downloadJobVideo(jobId) {
  const btn = document.getElementById("downloadVideoBtn");
  if (btn) { btn.disabled = true; btn.textContent = "Preparing download..."; }
  try {
    if (!state.user) throw new Error("Please sign in to continue.");
    const res = await fetch(`/api/jobs/${jobId}/download`, {
      headers: { Authorization: `Bearer ${await state.user.getIdToken()}` },
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || "This video isn't ready yet.");
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "gift-visuals-edit.mp4";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (err) {
    showToastError(err.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "Download video"; }
  }
}

/* ---------------------------------------------------------------------- */
/* Plans                                                                    */
/* ---------------------------------------------------------------------- */
function renderPlansPage(root) {
  const plans = [
    { id: "free", name: "Free", price: "$0", limit: 5, features: ["5 combined uploads", "Standard queue priority", "720p output", "Weekly AI usage allowance"] },
    { id: "pro", name: "Pro", price: "—", limit: 15, features: ["15 combined uploads", "Higher queue priority", "1080p output", "Larger weekly AI usage allowance"] },
    { id: "max", name: "Max", price: "—", limit: 70, features: ["70 combined uploads", "Highest queue priority", "Up to 4K output", "Largest weekly AI usage allowance"] },
  ];
  const currentPlan = state.usage?.planId || "free";

  root.innerHTML = `
    <div class="page-head"><h1>Plans</h1><p>Gift Visuals uses an AI usage system, not a simple video count — heavier edits use more usage.</p></div>
    <div class="plan-grid">
      ${plans
        .map(
          (p) => `
        <div class="glass plan-card ${p.id === currentPlan ? "current" : ""}">
          ${p.id === currentPlan ? '<span class="tag">Current plan</span>' : ""}
          <h3>${p.name}</h3>
          <div class="plan-limit"><b>${p.limit}</b> combined uploads per project</div>
          <ul>${p.features.map((f) => `<li>${icon("spark")}${f}</li>`).join("")}</ul>
          <button class="btn ${p.id === currentPlan ? "" : "btn-primary"}" data-plan="${p.id}" ${p.id === currentPlan ? "disabled" : ""}>
            ${p.id === currentPlan ? "Current plan" : state.user ? "Switch plan" : "Sign in to choose"}
          </button>
        </div>`
        )
        .join("")}
    </div>
    <p class="hint" style="margin-top:18px;">Weekly usage resets every Saturday at 12:00 PM WAT. Billing and payments are coming soon — plan switching here is provisional while payments are being built.</p>
  `;

  root.querySelectorAll("[data-plan]").forEach((btn) =>
    btn.addEventListener("click", async () => {
      if (!state.user) return openAuthModal("signup");
      try {
        state.usage = await api("/dev/set-plan", { method: "POST", body: { planId: btn.dataset.plan } });
        renderPlansPage(root);
      } catch (err) {
        alert(err.message);
      }
    })
  );
}

/* ---------------------------------------------------------------------- */
/* Profile                                                                  */

let profileTab = "profile";
function renderProfilePage(root) {
  if (!state.user) {
    root.innerHTML = `
      <div class="empty-state glass">
        ${icon("profile")}
        <h3>Sign in to view your profile</h3>
        <p>Track your plan, usage and billing status.</p>
        <button class="btn btn-primary" id="profileSignIn" style="margin-top:16px;">Sign in</button>
      </div>`;
    document.getElementById("profileSignIn").onclick = () => openAuthModal("login");
    return;
  }

  const u = state.user;
  const usage = state.usage;
  const initial = (u.displayName || u.email || "?")[0].toUpperCase();

  root.innerHTML = `
    <div class="page-head"><h1>Profile</h1><p>Manage your account, plan and usage.</p></div>
    <div class="glass profile-header">
      <div class="avatar-lg">${u.photoURL ? `<img src="${u.photoURL}" alt="" />` : initial}</div>
      <div>
        <h2>${escapeHtml(u.displayName || "Unnamed user")}</h2>
        <p>${escapeHtml(u.email || "")}</p>
      </div>
    </div>

    <div class="tab-row" style="margin-top:20px;">
      <button class="tab-btn ${profileTab === "profile" ? "active" : ""}" data-tab="profile">Profile</button>
      <button class="tab-btn ${profileTab === "plan" ? "active" : ""}" data-tab="plan">Plan</button>
      <button class="tab-btn ${profileTab === "billing" ? "active" : ""}" data-tab="billing">Billing</button>
    </div>
    <div id="profileTabContent"></div>
  `;

  root.querySelectorAll("[data-tab]").forEach((btn) =>
    btn.addEventListener("click", () => { profileTab = btn.dataset.tab; renderProfilePage(root); })
  );

  const content = document.getElementById("profileTabContent");
  if (profileTab === "profile") {
    content.innerHTML = `
      <div class="glass panel">
        <div class="info-row"><span class="k">Name</span><span class="v">${escapeHtml(u.displayName || "—")} <button class="link-btn" id="editNameBtn">Edit</button></span></div>
        <div class="info-row"><span class="k">Email</span><span class="v">${escapeHtml(u.email || "—")}</span></div>
        <div class="info-row"><span class="k">Sign-in method</span><span class="v">${u.providerData?.[0]?.providerId === "google.com" ? "Google" : "Email"}</span></div>
        <div class="info-row"><span class="k">Sign out</span><button class="link-btn" id="signOutBtn">Sign out</button></div>
      </div>`;
    document.getElementById("editNameBtn").onclick = async () => {
      const name = prompt("Update your name", u.displayName || "");
      if (name === null) return;
      await updateProfile(auth.currentUser, { displayName: name });
      state.user = auth.currentUser;
      renderProfilePage(root);
      renderAccountSlot();
    };
    document.getElementById("signOutBtn").onclick = () => signOut(auth);
  } else if (profileTab === "plan") {
    const remainingPct = usage ? Math.round((usage.remainingUnits / usage.usageLimitPerWeek) * 100) : 0;
    content.innerHTML = `
      <div class="glass panel">
        <div class="info-row"><span class="k">Current plan</span><span class="v">${usage ? usage.planName : "—"}</span></div>
        <div class="info-row"><span class="k">Weekly reset</span><span class="v">${usage ? new Date(usage.nextResetAt).toLocaleString() : "—"}</span></div>
        <div class="usage-meter">
          <div class="info-row" style="border:none; padding-bottom:0;"><span class="k">Usage remaining</span><span class="v">${usage ? `${usage.remainingUnits} / ${usage.usageLimitPerWeek}` : "—"}</span></div>
          <div class="bar"><div style="width:${remainingPct}%"></div></div>
        </div>
        <button class="btn btn-primary" data-link href="/plans" style="margin-top:16px;">Change plan</button>
      </div>`;
  } else {
    content.innerHTML = `
      <div class="glass panel">
        <div class="info-row"><span class="k">Current plan</span><span class="v">${usage ? usage.planName : "—"}</span></div>
        <div class="info-row"><span class="k">Billing status</span><span class="v">No payment method on file</span></div>
        <p class="billing-note">Payment processing isn't live yet. When it is, you'll be able to upgrade, downgrade and manage billing right here.</p>
        <button class="btn" disabled style="margin-top:14px;">Manage billing (coming soon)</button>
      </div>`;
  }
}

/* ---------------------------------------------------------------------- */
/* Auth modal                                                               */
/* ---------------------------------------------------------------------- */
function openAuthModal(mode = "login", note) {
  const root = document.getElementById("modalRoot");
  const isSignup = mode === "signup";
  root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal glass-strong">
        <button class="modal-close" id="modalClose" aria-label="Close">${icon("close")}</button>
        <h2>${isSignup ? "Create your account" : "Welcome back"}</h2>
        <p class="sub">${note || (isSignup ? "Create a free account to start editing." : "Sign in to continue to Gift Visuals.")}</p>
        <form id="authForm">
          ${isSignup ? `<div class="field"><label for="nameField">Name</label><input id="nameField" type="text" autocomplete="name" /></div>` : ""}
          <div class="field"><label for="emailField">Email</label><input id="emailField" type="email" required autocomplete="email" /></div>
          <div class="field"><label for="passwordField">Password</label><input id="passwordField" type="password" required minlength="6" autocomplete="${isSignup ? "new-password" : "current-password"}" /></div>
          <button class="btn btn-primary auth-submit" type="submit">${isSignup ? "Create account" : "Sign in"}</button>
        </form>
        <div id="authMsg"></div>
        <div class="auth-divider">or</div>
        <button class="btn google-btn" id="googleBtn">${icon("google")} Continue with Google</button>
        <div class="auth-switch">
          ${isSignup ? "Already have an account?" : "New to Gift Visuals?"}
          <button id="switchModeBtn">${isSignup ? "Sign in" : "Create an account"}</button>
        </div>
        ${!isSignup ? `<div class="auth-switch"><button id="forgotBtn">Forgot password?</button></div>` : ""}
      </div>
    </div>`;

  const close = () => { root.innerHTML = ""; };
  document.getElementById("modalClose").onclick = close;
  document.getElementById("modalOverlay").addEventListener("click", (e) => { if (e.target.id === "modalOverlay") close(); });
  document.getElementById("switchModeBtn").onclick = () => openAuthModal(isSignup ? "login" : "signup", note);
  const forgotBtn = document.getElementById("forgotBtn");
  if (forgotBtn) forgotBtn.onclick = async () => {
    const email = document.getElementById("emailField").value;
    if (!email) return setAuthMsg("Enter your email above first.", true);
    try {
      await sendPasswordResetEmail(auth, email);
      setAuthMsg("Password reset email sent.", false);
    } catch (err) {
      setAuthMsg(friendlyAuthError(err), true);
    }
  };

  document.getElementById("authForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("emailField").value.trim();
    const password = document.getElementById("passwordField").value;
    try {
      if (isSignup) {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        const name = document.getElementById("nameField").value.trim();
        if (name) await updateProfile(cred.user, { displayName: name });
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
      close();
    } catch (err) {
      setAuthMsg(friendlyAuthError(err), true);
    }
  });

  document.getElementById("googleBtn").addEventListener("click", async () => {
    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
      close();
    } catch (err) {
      setAuthMsg(friendlyAuthError(err), true);
    }
  });
}

function setAuthMsg(msg, isError) {
  const el = document.getElementById("authMsg");
  if (el) el.innerHTML = `<div class="${isError ? "auth-error" : "auth-note"}">${escapeHtml(msg)}</div>`;
}

function friendlyAuthError(err) {
  const map = {
    "auth/email-already-in-use": "That email is already registered — try signing in instead.",
    "auth/invalid-email": "That email address doesn't look right.",
    "auth/weak-password": "Please use a password with at least 6 characters.",
    "auth/user-not-found": "We couldn't find an account with that email.",
    "auth/wrong-password": "That password doesn't match this account.",
    "auth/invalid-credential": "Incorrect email or password.",
    "auth/popup-closed-by-user": "Sign-in was cancelled.",
    "auth/too-many-requests": "Too many attempts — please wait a moment and try again.",
  };
  return map[err.code] || "Something went wrong. Please try again.";
}

/* ---------------------------------------------------------------------- */
/* Auth state + boot                                                        */
/* ---------------------------------------------------------------------- */
async function refreshUsage() {
  if (!state.user) { state.usage = null; return; }
  try { state.usage = await api("/usage"); } catch { state.usage = null; }
}

onAuthStateChanged(auth, async (user) => {
  state.user = user;
  state.draftId = null;
  state.assets = [];
  await refreshUsage();
  render();
});

render();
</script>
